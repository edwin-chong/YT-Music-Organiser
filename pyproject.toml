[project]
name = "ytorganiser"
version = "0.1.0"
description = "Pull songs out of your YouTube Liked Videos and auto-sort them into playlists by genre/mood using Claude."
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "mcp>=1.2.0",
    "flask>=3.0",
]

[project.scripts]
ytorganiser = "ytorganiser.cli:main"
ytorganiser-mcp = "ytorganiser.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
